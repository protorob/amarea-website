name: Hero
icon: image
preview: fields

tabs:
  content:
    label: Content
    fields:
      icon:
        type: files
        label: Icon
        query: page.files
        multiple: false
        layout: cards
      eyebrow:
        type: text
      title:
        type: text
      description:
        type: writer
        label: Description
      buttons:
        extends: fields/buttons

  layout:
    label: Layout
    fields:
      backgroundType:
        type: select
        label: Background
        options:
          color: Color
          image: Full image
          video: Video
        default: color
      backgroundColor:
        type: select
        label: Background color
        options:
          ink: Ink (dark navy)
          bg: Cream
          primary: Blue
          accent: Olive
        default: ink
        when:
          backgroundType: color
      backgroundImage:
        type: files
        label: Background image
        query: page.files
        accept: image
        multiple: false
        layout: cards
        when:
          backgroundType: image
      overlayColor:
        type: select
        label: Gradient overlay color
        options:
          ink: Ink (dark navy)
          accent: Olive
          none: None
        default: ink
        when:
          backgroundType: image
      backgroundVideo:
        type: files
        label: Background video
        query: page.files
        accept: video
        multiple: false
        layout: cards
        when:
          backgroundType: video
      height:
        type: select
        options:
          normal: Normal
          half: Half height
          full: Full height
        default: normal
      textColor:
        type: select
        label: Text color
        options:
          white: White
          ink: Ink (dark navy)
          bg: Cream
        default: white
