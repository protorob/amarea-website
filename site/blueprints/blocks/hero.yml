name: Hero
icon: image
preview: fields

tabs:
  content:
    label: Content
    fields:
      icon:
        type: files
        label: Icon
        query: page.files
        multiple: false
        layout: cards
      iconSize:
        type: select
        label: Icon size
        options:
          small: Small
          medium: Medium
          large: Large
        default: medium
        when:
          icon: true
      eyebrow:
        type: text
      title:
        type: text
      description:
        type: writer
        label: Description
      buttons:
        extends: fields/buttons

  layout:
    extends: tabs/layout
    fields:
      # Hero is usually the colorful full-bleed section, so it defaults
      # differently than the other blocks (which default to no background).
      backgroundType:
        default: color
      textColor:
        default: "#ffffff"
