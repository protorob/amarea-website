title: Property
icon: home

tabs:
  content:
    label: Content
    sections:
      hero:
        type: fields
        fields:
          heroImage:
            type: files
            label: Hero image
            help: Full-width banner behind the page title. Leave empty to use the default A'Marea ocean-waves shot.
            query: page.files
            accept: image
            multiple: false
            layout: cards

      intro:
        type: fields
        fields:
          subtitle:
            type: text
            help: "e.g. Work well. Live slowly. Feel at home."
          introText:
            type: textarea
          gallery:
            type: files
            label: Gallery

      spaces:
        type: fields
        fields:
          spaces:
            type: structure
            label: Spaces (e.g. Living Room, Kitchen, Garden)
            fields:
              title:
                type: text
              text:
                type: textarea
              image:
                type: files
                multiple: false

      amenities:
        type: fields
        fields:
          amenities:
            type: structure
            label: Amenities
            fields:
              icon:
                type: text
                width: 1/6
                help: emoji
              label:
                type: text
                width: 5/6

      cta:
        type: fields
        fields:
          ctaLabel:
            type: text
            help: "e.g. Find your place / Find your apartment"

      units:
        type: pages
        label: Bookable units
        layout: cards
        template:
          - unit
