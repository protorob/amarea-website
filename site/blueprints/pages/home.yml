title: Home
icon: home

tabs:
  content:
    label: Content
    sections:
      hero:
        type: fields
        fields:
          heroVideo:
            type: files
            label: Hero background video
            query: page.files
            accept: video
            multiple: false
            layout: cards
          heroPoster:
            type: files
            label: Hero poster image
            help: Shown while the video loads, and as the background if it can't play
            query: page.files
            accept: image
            multiple: false
            layout: cards
          heroEyebrow:
            type: text
            label: Eyebrow
            default: For remote workers, travelers & creatives
          heroTitle:
            type: text
            label: Title
            default: Where the tide sets your pace.
          heroDescription:
            type: writer
            label: Description
          buttons:
            extends: fields/buttons

      blocks:
        type: fields
        fields:
          blocks:
            type: blocks
            fieldsets:
              - hero
              - slider
              - highlights
              - locations
              - elfsight
