title: Room / Apartment
icon: bed

tabs:
  content:
    label: Content
    sections:
      intro:
        type: fields
        fields:
          roomNumber:
            type: text
            label: Room number
            width: 1/3
            help: Leave empty for apartments
          bookingEngineId:
            type: text
            label: Booking-engine unit ID
            width: 2/3
            help: Filled in once the live booking engine is wired up (v1 ships waitlist-only)
          subtitle:
            type: text
            help: "e.g. Sea View & Private Terrace"
          description:
            type: textarea

      features:
        type: fields
        fields:
          features:
            type: tags
            label: "Features (bed, bathroom, view, desk, A/C…)"

      gallery:
        type: fields
        fields:
          gallery:
            type: files
            label: Gallery

      cta:
        type: fields
        fields:
          ctaLabel:
            type: text
            default: Show availability & start booking
