title: Room / Apartment
icon: bed

tabs:
  content:
    label: Content
    fields:
      mainImage:
        type: files
        label: Main image
        help: Used on this room's own page and in the parent Location's room-listing cards.
        query: page.files
        accept: image
        multiple: false
        layout: cards
      roomNumber:
        type: text
        label: Room number
        width: 1/3
        help: Leave empty for apartments
      roomId:
        type: text
        label: Booking-engine unit ID
        width: 2/3
        help: Filled in once the live booking engine is wired up (v1 ships waitlist-only)
      subtitle:
        type: text
        help: "e.g. Sea View & Private Terrace"
      description:
        type: writer

      features:
        type: multiselect
        label: Room features
        help: Managed centrally in Settings → Room / apartment features
        options:
          type: query
          query: site.unitFeatures.toStructure
          text: "{{ item.label }}"
          value: "{{ item.label }}"

      gallery:
        type: files
        label: Gallery
        query: page.files
        accept: image
        layout: cards

      ctaLabel:
        type: text
        label: CTA label
        default: Show availability & start booking
