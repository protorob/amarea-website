title: Locations
icon: pin

tabs:
  content:
    label: Content
    sections:
      hero:
        type: fields
        fields:
          heroImage:
            type: files
            label: Hero image
            help: Full-width banner behind the page title. Leave empty to use the default A'Marea ocean-waves shot.
            query: page.files
            accept: image
            multiple: false
            layout: cards

      intro:
        type: fields
        fields:
          introTitle:
            type: text
            default: Your Mediterranean playground
          introText:
            type: textarea
          introGallery:
            type: files
            label: Gallery

      areaGuide:
        type: fields
        fields:
          areaGuideTitle:
            type: text
            default: Around A'Marea
          beachDaysText:
            type: textarea
            label: "Beach days & hidden coves"
          syracuseOrtigiaText:
            type: textarea
            label: "Syracuse & Ortigia"
          baroqueSicilyText:
            type: textarea
            label: "Baroque Sicily"
          natureAdventureText:
            type: textarea
            label: "Nature & adventure"
          foodWineText:
            type: textarea
            label: "Food, wine & local life"
          slowDaysText:
            type: textarea
            label: "Slow days by the sea"
          mapEmbed:
            type: textarea
            label: Interactive map embed (HTML/iframe)
            help: Pasted embed code for the favourite spots map, once available

      properties:
        type: pages
        label: Properties
        layout: cards
        template:
          - property
