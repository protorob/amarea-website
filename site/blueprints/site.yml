title: Site

tabs:
  content:
    label: Pages
    sections:
      pages:
        type: pages

  settings:
    label: Global settings
    sections:
      contact:
        type: fields
        fields:
          email:
            type: email
            label: Contact email
          whatsapp:
            type: text
            label: WhatsApp number
            help: Include country code, e.g. +39 333 1234567
          address:
            type: textarea
            label: Address
            size: small
          socialLinks:
            type: structure
            label: Social links
            help: Shown in the footer. Order here is the order they're shown in.
            fields:
              platform:
                type: select
                width: 1/3
                options:
                  facebook: Facebook
                  instagram: Instagram
                  linkedin: LinkedIn
                  tiktok: TikTok
                  youtube: YouTube
                  other: Other
              label:
                type: text
                width: 1/3
                help: "e.g. @amarea_coliving — shown next to the platform name"
              url:
                type: url
                width: 1/3
            columns:
              platform:
                width: 1/3
              label:
                width: 1/3
              url:
                width: 1/3

      unitFeatures:
        type: fields
        fields:
          unitFeatures:
            type: structure
            label: Room / apartment features
            help: >
              The catalog every room and apartment picks from (Room
              features field on the Room/Apartment blueprint). Centralized
              here so icon + wording stays consistent across all units.
            fields:
              icon:
                type: text
                width: 1/4
                help: emoji
              label:
                type: text
                width: 3/4
            columns:
              icon:
                width: 1/4
              label:
                width: 3/4

      footer:
        type: fields
        fields:
          footerClaim:
            type: text
            label: Footer claim
            default: Mediterranean Co-Living
      integrations:
        type: fields
        fields:
          elfsightWidgetClass:
            type: text
            label: Elfsight widget CSS class
            help: "e.g. elfsight-app-b9732c5e-fb14-494a-bebd-847bf5025bed — from the Elfsight embed snippet"
