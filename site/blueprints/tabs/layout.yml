label: Layout
fields:
  backgroundType:
    type: select
    label: Background
    options:
      none: None (page background)
      color: Color
      image: Full image
      video: Video
    default: none
  backgroundColor:
    type: color
    label: Background color
    mode: options
    options:
      "#1b2333": Ink (dark navy)
      "#fdf6cf": Cream
      "#1c45d9": Blue
      "#8d821c": Olive
    default: "#1b2333"
    when:
      backgroundType: color
  backgroundImage:
    type: files
    label: Background image
    query: page.files
    accept: image
    multiple: false
    layout: cards
    when:
      backgroundType: image
  overlayColor:
    type: select
    label: Gradient overlay color
    options:
      ink: Ink (dark navy)
      accent: Olive
      none: None
    default: ink
    when:
      backgroundType: image
  backgroundVideo:
    type: files
    label: Background video
    query: page.files
    accept: video
    multiple: false
    layout: cards
    when:
      backgroundType: video
  height:
    type: select
    options:
      normal: Normal
      half: Half height
      full: Full height
    default: normal
  textColor:
    type: color
    label: Text color
    mode: options
    options:
      "#1b2333": Ink (dark navy)
      "#ffffff": White
      "#fdf6cf": Cream
    default: "#1b2333"
